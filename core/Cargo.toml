[package]
name = "inkread-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
md-5 = "0.10"
hex = "0.4"
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
roxmltree = "0.21"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[features]
default = []
mock = []

[[example]]
name = "mock_server"
required-features = ["mock"]
