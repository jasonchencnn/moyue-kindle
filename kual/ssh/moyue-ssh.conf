# moyue-ssh: standalone, key-only SSH on port 22 (PW4 5.18.1.1.1).
#
# The only upstart file this extension installs. It does nothing unless the
# owner has enabled boot start (or KUAL asked for a one-shot manual start),
# and it never respawns: a manual "stop" stays stopped until the next start.
#
# Everything runs from /var/local/moyue-ssh, which must be root:root with mode
# 000 (the framework recurses chgrp/chmod g=u over /var/local; 000 leaves
# group and others with nothing). The scripts are entered relative to the
# checked directory, so replacing the path later cannot swap what runs.
description "moyue-ssh: key-only SSH on port 22"

start on started lab126
stop on stopping lab126

pre-start script
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/moyue-ssh
  EXPECT=${AGENT_TEST_DIR_MODE:-000}
  OWNER=${AGENT_TEST_OWNER:-0}
  refuse() {
    logger -t moyue-ssh "not starting: $*" 2> /dev/null || :
    printf 'moyue-ssh: %s\n' "$*" >&2
    exit 1
  }
  [ -L "$S" ] && refuse "$S is a symlink"
  [ -d "$S" ] || refuse "$S is missing"
  set -- $(stat -c '%u %a' "$S" 2> /dev/null)
  [ $# -eq 2 ] || refuse "cannot stat $S"
  [ "$1" = "$OWNER" ] || refuse "$S owner $1 is not $OWNER"
  [ "$((0$2))" -eq "$((0$EXPECT))" ] || refuse "$S mode $2 is not $EXPECT"
  [ -L "$S/service.sh" ] && refuse "$S/service.sh is a symlink"
  [ -f "$S/service.sh" ] || refuse "$S/service.sh is missing"
  if [ -f "$S/manual-start" ]; then
    [ -L "$S/manual-start" ] && refuse "$S/manual-start is a symlink"
    rm -f "$S/manual-start" || refuse "cannot consume the manual start marker"
  elif [ ! -f "$S/enabled" ]; then
    refuse "boot start is disabled"
  fi
end script

script
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/moyue-ssh
  EXPECT=${AGENT_TEST_DIR_MODE:-000}
  OWNER=${AGENT_TEST_OWNER:-0}
  [ -L "$S" ] && exit 1
  cd "$S" || exit 1
  set -- $(stat -c '%u %a' . 2> /dev/null)
  [ $# -eq 2 ] || exit 1
  [ "$1" = "$OWNER" ] || exit 1
  [ "$((0$2))" -eq "$((0$EXPECT))" ] || exit 1
  [ -L ./service.sh ] && exit 1
  [ -f ./service.sh ] || exit 1
  exec /bin/sh ./service.sh
end script

post-stop script
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/moyue-ssh
  OWNER=${AGENT_TEST_OWNER:-0}
  [ -L "$S" ] && exit 0
  cd "$S" 2> /dev/null || exit 0
  set -- $(stat -c '%u %a' . 2> /dev/null)
  [ $# -eq 2 ] || exit 0
  [ "$1" = "$OWNER" ] || exit 0
  [ $((0$2 & 077)) -eq 0 ] || exit 0
  [ -L ./service.sh ] && exit 0
  [ -f ./service.sh ] || exit 0
  /bin/sh ./service.sh cleanup
end script
