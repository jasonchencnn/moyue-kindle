[package]
name = "aristotle-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "E-book page renderer for Aristotle on the PW4, built on Plato's document engine"

# Not a default member of the workspace: plato-core links static C libraries
# (tools/build-plato.sh), which a fresh checkout does not have. Build with
# tools/build-render.sh; see README.md and docs/reader.md.

[features]
default = ["hal"]
# Lay EPUBs out with crengine-ng (through inkread-engine) instead of Plato's
# own HTML engine. Off by default: crengine-ng's sources live in the readest
# repository's engine/vendor, and Aristotle's Plato fork stays the default
# engine until the device build picks crengine up.
crengine = ["dep:inkread-engine", "dep:inkread-platform"]
# The device screen helper (aristotle-hal). The HAL drives the PW4's
# framebuffer and input, so it only builds on the device; host builds (the
# `render` command, the tests) turn it off with --no-default-features.
hal = ["dep:aristotle-hal"]

[dependencies]
aristotle-screen = { path = "../aristotle-screen" }
aristotle-hal = { path = "../aristotle-hal", optional = true }
aristotle-library = { path = "../aristotle-library" }
# The readest engine crate, in this repository (engine/, platform/). The
# engine lays the book out with crengine-ng and hands back the pages.
inkread-engine = { path = "../../../engine", optional = true, features = ["crengine"] }
inkread-platform = { path = "../../../platform", optional = true }
libc = "0.2"
# Same version as plato-core, to decode spine hrefs exactly as it does.
percent-encoding = "2.3.2"
regex = "1"
encoding_rs = "0.8"
# The EPUB container and package documents of the vertical engine (VERT-101).
# Already in the lock through aristotle-library, which pins the same version.
roxmltree = "0.21"
# Our Plato fork (third_party/plato, branch aristotle); docs/reader.md.
plato-core = { path = "../../third_party/plato/crates/core" }
# Same version as plato-core uses, to read EPUB metadata it does not expose
# and to write converted MOBI books (stored). Deflate only, as in plato-core
# (the fork's "core: zip deflate only"): EPUBs use no other codec.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
png = "0.18"
